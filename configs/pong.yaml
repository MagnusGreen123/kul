env: "ALE/Pong-v5"
pixel_env: true
seed: 42

# RSSM dimensions
embed_dim: 512
hidden_dim: 256
stoch_dim: 32
act_dim: 6              # Pong has 6 actions
obs_channels: 4         # 4 stacked grayscale frames
cnn_depth: 32

# Training
kl_weight: 1.0
kl_balance: 0.8
free_bits: 1.0
use_symlog: true
horizon: 15
gamma: 0.99
lambda_: 0.95
batch_size: 16
batch_length: 50
learning_rate: 3.0e-4
max_grad_norm: 100.0
mixed_precision: true

# Collection
prefill_steps: 2000
total_steps: 1000000
train_every: 5
train_steps: 1
checkpoint_every: 10000
log_every: 1000
eval_every: 10000

# Wandb
wandb_project: "dreamer"
use_wandb: true
