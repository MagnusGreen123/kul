env: "PongNoFrameskip-v4"
pixel_env: true
seed: 42

# RSSM dimensions
embed_dim: 512
hidden_dim: 256
stoch_dim: 32
act_dim: 6
obs_channels: 4
cnn_depth: 48
mlp_units: 400

# Training
kl_weight: 1.0
kl_balance: 0.8
free_bits: 1.0             # floor on sum — h bottleneck makes z essential for recon
use_symlog: true
horizon: 15
gamma: 0.99
lambda_: 0.95
batch_size: 512
batch_length: 30
learning_rate: 3.0e-4      # was 1e-4 — higher LR for faster initial learning
actor_lr: 8.0e-5
critic_lr: 3.0e-5
entropy_coeff: 3.0e-3
max_grad_norm: 10.0
mixed_precision: true

# Parallel collection
n_envs: 24
collect_per_step: 4000
train_ratio: 0.1           # keep low for speed — ~3h total

# Schedule — short run to verify learning signal
prefill_steps: 10000
total_steps: 50000          # ~50k steps, should take ~3h
checkpoint_every: 10000
log_every: 4000
eval_every: 10000

# Buffer
buffer_max_steps: 500000

# Wandb
wandb_project: "dreamer"
use_wandb: true
run_name: "short-v4-h-bottleneck"
