env: "BreakoutNoFrameskip-v4"
pixel_env: true
seed: 42

# RSSM dimensions — identical to Pong v24
embed_dim: 512
hidden_dim: 256
stoch_dim: 32
n_classes: 32
act_dim: 4                 # Breakout: NOOP, FIRE, RIGHT, LEFT
obs_channels: 4
cnn_depth: 48
mlp_units: 400
unimix: 0.01

# Training — same as Pong v24
kl_weight: 1.0
kl_balance: 0.8
free_bits: 1.0
recon_weight: 1.0
reward_weight: 10.0
fg_weight: 50.0
use_symlog: true
horizon: 15
gamma: 0.997
lambda_: 0.95
batch_size: 512
batch_length: 30
learning_rate: 1.0e-4
actor_lr: 1.0e-4
critic_lr: 1.0e-4
entropy_coeff: 3.0e-3
max_grad_norm: 10.0
mixed_precision: true

# Parallel collection
n_envs: 24
collect_per_step: 4000
train_ratio: 0.25

# Schedule
prefill_steps: 10000
total_steps: 500000
checkpoint_every: 50000
log_every: 4000
eval_every: 20000

# Buffer
buffer_max_steps: 2000000

# Wandb
wandb_project: "dreamer"
use_wandb: true
run_name: "breakout-v1"
