env: "PongNoFrameskip-v4"
pixel_env: true
seed: 42

# RSSM dimensions — medium size, fast per step
embed_dim: 512
hidden_dim: 256
stoch_dim: 32              # number of categorical distributions
n_classes: 32              # classes per categorical (flat z = 32×32 = 1024)
act_dim: 6
obs_channels: 4
cnn_depth: 48              # between 32 and 64
mlp_units: 400
unimix: 0.01               # uniform mixing in categorical probs (prevents collapse)

# Training
kl_weight: 0.01            # v18: lowered 10× so KL doesn't resist encoder encoding detail into z
kl_balance: 0.8
free_bits: 1.0             # DreamerV3 default — minimum total KL (nats) before gradient flows
recon_weight: 100.0        # v18: L1 loss ≈ 0.035 at mean-image → 100×0.035=3.5 dominates kl (0.01×1=0.01)
reward_weight: 10.0        # v18: upweight sparse reward signal (only ~0.1% of timesteps are non-zero)
use_symlog: true
horizon: 15
gamma: 0.997
lambda_: 0.95
batch_size: 512           # uint8 fix freed ~50% VRAM, 512 fits in ~26/32 GB
batch_length: 30
learning_rate: 1.0e-4
actor_lr: 1.0e-4
critic_lr: 1.0e-4
entropy_coeff: 3.0e-3     # lowered from 0.01 — policy was 99% uniform; unimix prevents collapse
max_grad_norm: 10.0
mixed_precision: true

# Parallel collection
n_envs: 24                # CPU was at 8%, more envs = faster collect
collect_per_step: 4000    # more env steps per round = fewer rounds
train_ratio: 0.25         # 1000 gradient steps per 4000 env steps — safer

# Schedule
prefill_steps: 10000
total_steps: 500000       # 500k is enough to see learning
checkpoint_every: 50000
log_every: 4000
eval_every: 20000         # v16: more frequent recon viz so we can kill early if decoder still collapses

# Buffer — capped by total transitions, not episode count.
# 2M steps * ~16 KB/step (uint8 obs) ≈ 32 GB RAM, safe for 96 GB machine.
buffer_max_steps: 2000000

# Wandb
wandb_project: "dreamer"
use_wandb: true
run_name: "v18-l1-lowkl"
