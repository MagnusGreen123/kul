env: "PongNoFrameskip-v4"
pixel_env: true
seed: 42

# JEPA encoder — CNN backbone + BatchNorm projector
embed_dim: 256
obs_channels: 4
cnn_depth: 48

# Predictor — transformer with AdaLN action conditioning
pred_depth: 4
pred_heads: 4
pred_mlp_dim: 512
pred_dropout: 0.1
history_size: 3

# SIGReg
sigreg_weight: 0.1
sigreg_knots: 17
sigreg_projections: 1024

# Loss weights
pred_weight: 1.0
rollout_weight: 0.5
reward_weight: 10.0
use_symlog: true

# Auxiliary decoder
aux_recon_weight: 1.0
aux_decoder_depth: 32
fg_weight: 50.0

# Actor-critic — v14: v11-baseline + horizon 15→8
# v11 was the best-performing run (peak +11). v12-v13 added real_td_weight
# and critic_lr_decay; both correlated with worse late-stage outcomes
# (v13 stuck in over-est regime, never broke past -8). Reverting both.
#
# Single change from v11: horizon 15→8. Probe data showed ~3px ball
# position error per step, compounding 15x over horizon. Halving the
# bootstrap chain should reduce imagined-return bias and may make the
# v11 breakthrough (+11 spike) more reproducible / sustainable.
ac_warmup_steps: 20000
ac_gate_threshold: 0.015
act_dim: 6
mlp_units: 400
horizon: 8                  # CHANGED from v11: was 15
gamma: 0.997
lambda_: 0.95
entropy_coeff: 3.0e-3
critic_ema_decay: 0.98
critic_grad_clip: 1.5
critic_lr: 1.0e-4
# NO real_td_weight (reverted from v12/v13 — caused over-est regime)
# NO critic_lr_min / critic_lr_decay_steps (reverted from v13)

# Training
batch_size: 512
batch_length: 30
learning_rate: 1.0e-4
actor_lr: 1.0e-4
max_grad_norm: 2.0
mixed_precision: false
warmup_steps: 5000
lr_schedule: cosine

# Parallel collection
n_envs: 24
collect_per_step: 4000
train_ratio: 0.25

# Schedule
prefill_steps: 10000
total_steps: 500000
checkpoint_every: 50000
log_every: 4000
eval_every: 20000

# Buffer — same short buffer as v11
buffer_max_steps: 200000

# Breakthrough tracking (NEW v14)
reward_window_size: 50      # episodes in rolling window for window_avg metric
best_window_min_eps: 30     # min episodes before "best" checkpoint can save

# Wandb
wandb_project: "dreamer"
use_wandb: true
run_name: "jepa-v14"
