env: "PongNoFrameskip-v4"
pixel_env: true
seed: 42

# RSSM dimensions — larger to utilize V100
embed_dim: 1024
hidden_dim: 512
stoch_dim: 64
act_dim: 6              # Pong has 6 actions
obs_channels: 4         # 4 stacked grayscale frames
cnn_depth: 64           # deeper CNN (was 32)
mlp_units: 512          # MLP hidden size for actor/critic/reward

# Training — large batches for V100 32GB
kl_weight: 1.0
kl_balance: 0.8
free_bits: 1.0
use_symlog: true
horizon: 15
gamma: 0.99
lambda_: 0.95
batch_size: 64            # was 16 — fills GPU memory better
batch_length: 50
learning_rate: 3.0e-4
max_grad_norm: 100.0
mixed_precision: true

# Parallel collection — more envs for throughput
n_envs: 16               # was 8
collect_per_step: 2000    # was 1000
train_ratio: 0.5          # 1000 gradient steps per 2000 env steps

# Schedule
prefill_steps: 10000
total_steps: 1000000
checkpoint_every: 50000
log_every: 2000
eval_every: 50000

# Buffer — use the massive RAM
buffer_capacity: 5000     # was 1000

# Wandb
wandb_project: "dreamer"
use_wandb: true
