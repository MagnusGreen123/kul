env: "PongNoFrameskip-v4"
pixel_env: true
seed: 42

# RSSM dimensions — sized for V100 32GB
embed_dim: 1024
hidden_dim: 512
stoch_dim: 64
act_dim: 6
obs_channels: 4
cnn_depth: 64
mlp_units: 512

# Training — large batches, shorter sequences for speed
kl_weight: 1.0
kl_balance: 0.8
free_bits: 1.0
use_symlog: true
horizon: 15
gamma: 0.99
lambda_: 0.95
batch_size: 512           # maximize GPU saturation on V100 32GB
batch_length: 30          # shorter sequences = faster RSSM loop
learning_rate: 1.0e-4     # lower LR for stability with large model
max_grad_norm: 10.0       # tighter clipping to prevent NaN
mixed_precision: true

# Parallel collection
n_envs: 16
collect_per_step: 2000
train_ratio: 0.15         # 300 gradient steps per 2000 env steps

# Schedule
prefill_steps: 10000
total_steps: 1000000
checkpoint_every: 50000
log_every: 2000
eval_every: 50000

# Buffer
buffer_capacity: 5000

# Wandb
wandb_project: "dreamer"
use_wandb: true
