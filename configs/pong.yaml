env: "PongNoFrameskip-v4"
pixel_env: true
seed: 42

# RSSM dimensions
embed_dim: 512
hidden_dim: 256
stoch_dim: 32
act_dim: 6              # Pong has 6 actions
obs_channels: 4         # 4 stacked grayscale frames
cnn_depth: 32

# Training
kl_weight: 1.0
kl_balance: 0.8
free_bits: 1.0
use_symlog: true
horizon: 15
gamma: 0.99
lambda_: 0.95
batch_size: 16
batch_length: 50
learning_rate: 3.0e-4
max_grad_norm: 100.0
mixed_precision: true

# Parallel collection
n_envs: 8                # parallel environments
collect_per_step: 1000    # env steps per collect phase
train_ratio: 0.5          # gradient steps per env step (500 train steps per 1000 env steps)

# Schedule
prefill_steps: 10000      # ~10 Pong episodes to ensure buffer has data
total_steps: 1000000
checkpoint_every: 50000
log_every: 1000
eval_every: 50000

# Wandb
wandb_project: "dreamer"
use_wandb: true
